version: "3.8"

# =============================================================================
# Teste isolado de white-label — só o frontend
# Uso: docker compose -f docs/local/docker-compose.whitelabel-test.yml up
# Acesso: http://localhost:8088
# =============================================================================
# Não precisa de banco, redis ou outros serviços.
# As VITE_* apontam para a VPS real — o frontend carrega e autentica normalmente.
# Edite as vars APP_* abaixo e rode `docker compose up --force-recreate` para
# ver as mudanças de white-label sem precisar redeployar no Swarm.
# =============================================================================

services:
  evo_frontend_test:
    image: lc1868/evo-ai-frontend-community:latest
    ports:
      - "8088:80"
    environment:
      VITE_APP_ENV: "production"
      VITE_API_URL: "https://apievocrm.l2csolucoes.com.br"
      VITE_AUTH_API_URL: "https://apievocrm.l2csolucoes.com.br"
      VITE_WS_URL: "wss://apievocrm.l2csolucoes.com.br"
      VITE_EVOAI_API_URL: "https://apievocrm.l2csolucoes.com.br"
      VITE_EVOFLOW_API_URL: "https://apievocrm.l2csolucoes.com.br"
      VITE_AGENT_PROCESSOR_URL: "https://apievocrm.l2csolucoes.com.br"
      # ── White Label ──────────────────────────────────────────────────────
      APP_NAME: "CRM L2C Solucoes"
      APP_TITLE: "CRM L2C Solucoes"
      APP_LOGO_URL: ""
      APP_FAVICON_URL: ""
      APP_DOCS_URL: ""
      APP_SUPPORT_URL: ""
      APP_COPYRIGHT: "© 2026 L2C Soluções. Todos os direitos reservados."
